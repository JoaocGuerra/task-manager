name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: task_manager
          POSTGRES_USER: task_manager
          POSTGRES_PASSWORD: task_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U task_manager -d task_manager"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/task_manager
          DB_USERNAME: task_manager
          DB_PASSWORD: task_manager
        run: ./mvnw test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/joaocguerra/task-manager:latest
            ghcr.io/joaocguerra/task-manager:${{ github.sha }}